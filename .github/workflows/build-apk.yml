name: Build Expired Goods APK
on:
  push:
    branches: [main, master]
    paths:
      - ExpiredGoods_OneUpload.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check and unpack single-upload ZIP
        run: |
          set -e
          if [ ! -f ExpiredGoods_OneUpload.zip ]; then
            echo "Missing ExpiredGoods_OneUpload.zip in the repository root"
            exit 1
          fi
          mkdir -p source
          unzip -oq ExpiredGoods_OneUpload.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p source :app:assembleDebug --no-daemon --stacktrace
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredGoods-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
