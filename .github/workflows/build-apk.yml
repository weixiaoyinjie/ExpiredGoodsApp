name: Build Expired Goods APK

on:
  push:
    branches: [main, master]
    paths:
      - 'ExpiredGoods_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ubuntu-24.04 already includes Android SDK 35 and Build Tools 35.0.0.
    # Avoid android-actions/setup-android, whose extra download failed.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack App ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ExpiredGoods_OneUpload.zip || { echo 'Missing ExpiredGoods_OneUpload.zip in repo root'; exit 1; }
          mkdir -p source
          unzip -oq ExpiredGoods_OneUpload.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -n "${ANDROID_HOME:-}" || { echo 'Android SDK environment is missing'; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo 'Android SDK Platform 35 missing'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo 'Android Build Tools 35.0.0 missing'; exit 1; }
          echo 'Preinstalled Android SDK 35 is ready.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p source :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredGoods-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
