name: Build Expired Goods APK

on:
  push:
    branches: [main, master]
    paths:
      - 'ExpiredGoods_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f ExpiredGoods_OneUpload.zip || { echo 'ERROR: repository root is missing ExpiredGoods_OneUpload.zip'; exit 1; }
          mkdir -p source
          unzip -oq ExpiredGoods_OneUpload.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          find source/app/src/main -type f | sort

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo 'Android SDK 35 ready'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and print failure details
        id: apk_build
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gradle -p source :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-debug.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo ''
            echo '========== COMPILATION ERRORS: LOOK HERE =========='
            grep -n -E '(^|[[:space:]])error:|FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|Android resource linking failed|Manifest merger failed|AAPT:|Caused by:|Compilation failed|BUILD FAILED' build-debug.log | tail -n 90 || true
            echo '========== LAST 100 LOG LINES =========='
            tail -n 100 build-debug.log
            {
              echo '## APK compilation failed'
              echo 'Open the **Build APK and print failure details** step and look for **COMPILATION ERRORS**.'
              echo ''
              echo '### Last 100 log lines'
              echo '```text'
              tail -n 100 build-debug.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredGoods-BuildLog
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredGoods-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
